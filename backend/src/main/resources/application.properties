spring.application.name=Consultant Management System
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/consultant_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.security.jwt-secret=${JWT_SECRET:consultant-management-system-local-secret-key}
app.security.jwt-expiration-minutes=120
